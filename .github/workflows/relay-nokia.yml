name: Relay Nokia MD images to Release

# 从构建产物 ponwrt-an7581.tar.zst 中解出 Nokia XG-040G-MD 的镜像文件（sysupgrade 等），
# 计算 sha256 后上传到现有 Release，供设备侧直接下载刷机
# （设备存储放不下 346MB 全包，单设备镜像只有几十 MB）

on:
  push:
    paths: ['.github/workflows/relay-nokia.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relay-nokia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract Nokia XG-040G-MD images and upload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '12569577876'
          TAG: 'ponwrt-an7581-v3-20261025'
        run: |
          set -euxo pipefail
          gh api "/repos/wuzei-chen/ponwrt-oaf/actions/artifacts/$ARTIFACT_ID/zip" > art.zip
          unzip -q art.zip -d pkg
          tar --zstd -xf pkg/ponwrt-an7581.tar.zst
          echo "=== 增量包验证（zram/OAF/luci-compat/bash 等必须命中）==="
          find an7581/packages -name '*.apk' 2>/dev/null | grep -E 'zram|oaf|luci-compat|bash|ip-full|lsblk' | head -12 || true
          find an7581 -name 'kmod-zram*' -o -name 'zram-swap*' | head -4 || true
          mkdir out
          find an7581 -type f -name '*nokia*xg-040g-md*' -exec cp {} out/ \;
          echo "=== extracted files ==="
          ls -l out/
          # 抹平路径前缀，便于设备端核对
          (cd out && sha256sum * > sha256sums-nokia-md)
          gh release upload "$TAG" out/* --repo wuzei-chen/ponwrt-oaf --clobber
          echo "=== release assets now ==="
          gh release view "$TAG" --repo wuzei-chen/ponwrt-oaf --json assets -q '.assets[].name'
