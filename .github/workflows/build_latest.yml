name: Build PonWrt an7581 (upstream)

# 用法：放到自己 GitHub 空仓库的 .github/workflows/ 下，Actions 页面手动触发（workflow_dispatch）
# 构建内容：clone pbs05/ponwrt 指定 ref（默认 master）→ 全量构建 an7581 → 产出 ponwrt-an7581.tar.zst
# 参考原型：huladabang/ponwrt release.yml（已验证可产出当前设备正在运行的固件）
# 上游 configs 与 huladabang 的实质等价（2026-10-24 diff 核验，仅 6 行 EVB 冗余声明差异）

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build_latest.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'pbs05/ponwrt ref to build'
        required: false
        default: 'master'

permissions:
  contents: read

concurrency:
  group: build-an7581-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581 from ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Clone PonWrt source
        run: |
          REF="${{ inputs.ref }}"
          REF="${REF:-master}"
          echo "Building pbs05/ponwrt @ $REF"
          git clone --depth 1 --branch "$REF" https://github.com/pbs05/ponwrt.git .

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure an7581
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config
          # 本机定制增量（2026-10-24 起）：
          #  - zram-swap：内存压缩交换（用户要求）
          #  - bash/ip-full/lsblk：quickstart 硬依赖，内建免去刷机后重装
          #  - oaf/kmod-oaf：OAF 后端内建，vermagic 永远匹配内核，退役单独重编
          #  - luci-compat：CBI 框架（OAF 前端硬依赖，2026-10-24 晚发现缺失）
          #  - appfilter/kmod-oaf：OAF 全套内建（用户态包名是 appfilter 不是 oaf！
          #    2026-10-25 v3 教训：写成 oaf 被 defconfig 静默丢弃，导致固件有 ko 无 oafd）
          echo 'CONFIG_PACKAGE_zram-swap=y' >> .config
          echo 'CONFIG_PACKAGE_bash=y' >> .config
          echo 'CONFIG_PACKAGE_ip-full=y' >> .config
          echo 'CONFIG_PACKAGE_lsblk=y' >> .config
          echo 'CONFIG_PACKAGE_appfilter=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-oaf=y' >> .config
          echo 'CONFIG_PACKAGE_luci-compat=y' >> .config
          #  - dae eBPF 透明代理（2026-10-25 改进1，对齐恩山"光猫吃鹅"）：
          #    2026-10-25 二次教训：必须用 KERNEL_ 前缀选项（裸 CONFIG_DEBUG_INFO_BTF
          #    被 defconfig 丢弃），且 base config 的 KERNEL_DEBUG_INFO_REDUCED=y 会
          #    阻止 BTF 生成（BTF 需要完整 DWARF），必须显式 unset。
          #    BPF 工具链显式选 BUILD_LLVM（自包含，不依赖 runner 上的宿主 LLVM 版本）。
          echo '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' >> .config
          echo 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' >> .config
          echo 'CONFIG_KERNEL_CGROUP_BPF=y' >> .config
          echo 'CONFIG_BPF_TOOLCHAIN_BUILD_LLVM=y' >> .config
          echo 'CONFIG_PACKAGE_dae=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sched-bpf=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-veth=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-xdp-sockets-diag=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          make defconfig
          echo "=== custom additions resolved ==="
          grep -E 'CONFIG_PACKAGE_(zram-swap|bash|ip-full|lsblk|appfilter|dae|kmod-(oaf|sched-bpf|veth|xdp-sockets-diag|nft-tproxy))=' .config || true
          echo "=== kernel BTF/BPF ==="
          grep -E 'CONFIG_(KERNEL_DEBUG_INFO_BTF|KERNEL_DEBUG_INFO_REDUCED|BPF_TOOLCHAIN|HAS_BPF_TOOLCHAIN|KERNEL_BPF_EVENTS|KERNEL_CGROUP_BPF)' .config || echo 'WARN: BTF options dropped by defconfig!'

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)"

      - name: List built images
        run: |
          echo "=== bin/targets/airoha/an7581 ==="
          ls -l bin/targets/airoha/an7581/ || true
          echo "=== nokia images ==="
          find bin/targets/airoha/an7581 -type f -name '*nokia*' -exec ls -l {} \;

      - name: Pack
        run: |
          mkdir release
          tar --zstd -cf release/ponwrt-an7581.tar.zst -C bin/targets/airoha an7581
          sha256sum release/*.tar.zst > release/sha256sums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-${{ inputs.ref }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
