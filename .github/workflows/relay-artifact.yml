name: Relay artifact to Release

# 将指定 run 的 artifact 转存为 GitHub Release（artifact 14 天过期，Release 永久，且 release
# 下载走 github.com 域名，本机网络可达 api.github.com 不可达）
# 本次硬编码 artifact id：12552984689（run 40070505725, ponwrt-an7581-master）

on:
  push:
    paths: ['.github/workflows/relay-artifact.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifact and create release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '12624343117'
          TAG: 'ponwrt-an7581-btf-dae-20261025-r4'
        run: |
          set -euxo pipefail
          gh api "/repos/wuzei-chen/ponwrt-oaf/actions/artifacts/$ARTIFACT_ID/zip" > art.zip
          mkdir pkg && unzip -o art.zip -d pkg
          # 只保留小体积可直下的镜像文件（nokia sysupgrade/factory + sha256），丢弃 373MB tar.zst
          cd pkg
          tar --zstd -xf ponwrt-an7581.tar.zst
          find . -type f \( -iname '*nokia*' -o -name 'sha256sums' \) -exec mv {} . \;
          find . -maxdepth 1 -type f ! -iname '*nokia*' ! -name 'sha256sums' -delete
          rm -rf an7581
          ls -l
          cd ..
          if gh release view "$TAG" --repo wuzei-chen/ponwrt-oaf; then
            gh release upload "$TAG" pkg/* --repo wuzei-chen/ponwrt-oaf --clobber
          else
            gh release create "$TAG" pkg/* \
              --repo wuzei-chen/ponwrt-oaf \
              --target main \
              --title "PonWrt an7581 @ upstream master (2026-10-24)" \
              --notes "Built from pbs05/ponwrt master by run 40070505725. Contains ponwrt-an7581.tar.zst + sha256sums."
          fi
      # 备用通道：设备直连 release CDN 不稳定，把镜像推到 git 分支，
      # 本机 git 协议可靠 → clone 后走局域网推给设备。
      - name: Publish image to git branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p gitout
          cp pkg/ponwrt-airoha-an7581-nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb gitout/firmware.itb
          cd gitout
          git init -q .
          git config user.name wuzei-chen
          git config user.email wuzei-chen@users.noreply.github.com
          git add firmware.itb
          git commit -q -m "firmware: nokia_xg-040g-md ubi squashfs sysupgrade (btf+dae)"
          git branch -M firmware-r4
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/wuzei-chen/ponwrt-oaf.git"
          git push -f origin firmware-r4
